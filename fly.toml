app = "cavaquinho-lab-api"
primary_region = "gru"

[build]
  dockerfile = "apps/api/Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  APP_ENV = "production"
  OMR_IMPORTS_ENABLED = "false"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"
    method = "GET"
    path = "/api/ready"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
