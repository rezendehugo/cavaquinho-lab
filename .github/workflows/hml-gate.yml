name: HML release candidate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  hml-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Confirmar candidata de release
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          test "$SOURCE_BRANCH" = "hml" || {
            echo "A promoção para main deve partir da branch hml."
            exit 1
          }
      - name: Registrar promoção aguardando validação humana
        run: echo "A RC já foi publicada no GitHub Pages a partir de hml. A mesclagem deste PR é a promoção manual para produção."
