name: CI

on:
  workflow_call:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit UI copy and controls
        run: npm run audit:ui
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Browser layout tests
        run: npm run test:e2e
      - name: Build
        run: npm run build

  private-nivaldo-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NIVALDO_CORPUS_URL: ${{ secrets.NIVALDO_CORPUS_URL }}
      NIVALDO_CORPUS_SHA256: ${{ secrets.NIVALDO_CORPUS_SHA256 }}
    steps:
      - name: Explain optional corpus
        if: env.NIVALDO_CORPUS_URL == ''
        run: echo "Private Nivaldo corpus is not configured; public validation remains deterministic."
      - name: Checkout
        if: env.NIVALDO_CORPUS_URL != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        if: env.NIVALDO_CORPUS_URL != ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        if: env.NIVALDO_CORPUS_URL != ''
        run: npm ci
      - name: Download private corpus
        if: env.NIVALDO_CORPUS_URL != ''
        run: |
          curl --fail --location --silent --show-error "$NIVALDO_CORPUS_URL" --output "$RUNNER_TEMP/Nivaldo_no_choro.pdf"
          echo "$NIVALDO_CORPUS_SHA256  $RUNNER_TEMP/Nivaldo_no_choro.pdf" | sha256sum --check --strict
      - name: Run real Audiveris and API regression
        if: env.NIVALDO_CORPUS_URL != ''
        env:
          NIVALDO_NO_CHORO_PDF: ${{ runner.temp }}/Nivaldo_no_choro.pdf
        run: npm run test:corpus:nivaldo
